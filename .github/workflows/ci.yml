name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The collision maps are generated from the game client, so a redeploy can
  # invalidate anything baked in. The build's embedded maps are only a fallback
  # (the script re-extracts from the live client at runtime), but a weekly run
  # still catches the case where the game changes shape enough to break the
  # extractor itself -- which is the failure that would matter.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: web
        run: npm ci || npm install
      - name: Unit tests
        working-directory: web
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: web
        run: npm ci || npm install

      # Extract maps from the live client so the fallback shipped in the build is
      # current. Non-fatal: if the game is unreachable we fall back to the
      # committed snapshot rather than failing the build.
      - name: Extract maps from the live client
        working-directory: web
        continue-on-error: true
        run: node src/cli/main.js maps --out maps.json

      - name: Build userscript
        working-directory: web
        run: node build.mjs

      - name: Verify the built script parses
        working-directory: web
        run: node --check avalon-farm.user.js

      # The committed .user.js is a build artifact. Nothing stops someone editing
      # src/ and forgetting to rebuild, which leaves a stale script that installs
      # cleanly and behaves like the old code -- a confusing failure to chase.
      # Rebuild from the COMMITTED maps (not the freshly-extracted ones, which
      # legitimately differ whenever the game has redeployed) and diff.
      - name: Check the committed userscript is up to date
        working-directory: web
        run: |
          git checkout -- maps.json 2>/dev/null || true
          cp avalon-farm.user.js /tmp/committed.user.js
          node build.mjs
          if ! diff -q /tmp/committed.user.js avalon-farm.user.js; then
            echo "::error::web/avalon-farm.user.js is stale. Run: cd web && node build.mjs"
            diff /tmp/committed.user.js avalon-farm.user.js | head -40
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: avalon-farm.user.js
          path: web/avalon-farm.user.js
